schema_version: 1

context:
  name: pypika-tortoise
  version: "0.6.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 64d96c9b88450f6360ad22a7063933b6a90961a7317f04b2b63c98fd5d705506

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - pdm-backend
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pypika_tortoise
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Forked from pypika and streamline just for tortoise-orm
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/tortoise/pypika-tortoise

extra:
  recipe-maintainers:
    - thewchan
